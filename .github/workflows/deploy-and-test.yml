name: Live GitHub Pages Deploy & Selenium E2E Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy-and-test:
    name: Enterprise CI/CD - Build, Deploy, Verify & Live Selenium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1 - Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Dependency Installation
      - name: Stage 2 - Setup Node.js & Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Stage 2 (cont.) - Install Packages
        run: |
          echo "Installing frontend dependencies..."
          cd frontend
          npm install --legacy-peer-deps
          echo "Installing automation dependencies..."
          cd ../automation
          npm install

      # Stage 3: Build Application
      - name: Stage 3 - Build Application
        run: |
          echo "Building production web application for GitHub Pages with BASE_URL path..."
          cd frontend
          PUBLIC_URL="/${{ github.event.repository.name }}/" npm run build
          ls -la build/

      # Stage 4: Static Analysis
      - name: Stage 4 - Static Analysis
        run: |
          echo "Verifying generated production bundle assets..."
          test -f frontend/build/index.html || (echo "FATAL: index.html not found in build artifact" && exit 1)
          test -d frontend/build/static || (echo "FATAL: static bundle directory missing" && exit 1)
          echo "Static analysis and bundle verification passed."

      # Stage 5: Deploy to GitHub Pages
      - name: Stage 5 - Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          destination_dir: ./
          keep_files: true

      # Stage 6: Wait for Deployment
      - name: Stage 6 - Wait for Deployment
        run: |
          echo "Configured Live Deployment Target URL: $BASE_URL"
          cd automation
          node -e "
            const verifier = require('./utils/deploymentVerifier');
            verifier.waitForDeployment(120, 5).then(() => {
              console.log('Stage 6 - Deployment endpoint responded successfully.');
            }).catch(err => {
              console.warn('Deployment poll note:', err.message);
            });
          "

      # Stage 7: Deployment Verification
      - name: Stage 7 - Deployment Verification
        run: |
          cd automation
          node -e "
            const verifier = require('./utils/deploymentVerifier');
            verifier.verifyLiveAssets().then(diag => {
              console.log('Stage 7 - Deployment Verification Diagnostics:', JSON.stringify(diag, null, 2));
              if (diag.httpStatus >= 400) {
                console.error('Deployment verification failed with HTTP ' + diag.httpStatus);
                process.exit(1);
              }
            });
          "

      # Stage 8: Run Selenium E2E Tests
      # Stage 9: Generate Reports
      # Stage 10: Generate Excel Reports
      # Stage 13: Store Historical Results
      - name: Stage 8-10, 13 - Run Selenium E2E Tests & Compile Reports
        run: |
          echo "MANDATORY POLICY: Strictly prohibiting localhost. Executing against: $BASE_URL"
          cd automation
          node runners/liveSeleniumRunner.js

      # Stage 11: Upload Artifacts (Retention: 30 Days)
      - name: Stage 11 - Upload Artifacts (30 Days Retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodiebite-live-selenium-artifacts
          path: |
            Test Results/
            reports/
          retention-days: 30

      # Stage 12: Publish Summary
      - name: Stage 12 - Publish Summary to GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Live Execution Summary not found" >> $GITHUB_STEP_SUMMARY
          fi
