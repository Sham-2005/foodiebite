name: Android Appium E2E Automation & GitHub Pages CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Nightly regression at 02:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e-pipeline:
    name: Android Build, Emulator & Appium 400+ E2E Tests
    runs-on: macos-13 # macOS runners support hardware-accelerated KVM/HAXM nested virtualization for Android Emulators
    timeout-minutes: 90

    steps:
      # Stage 1: Checkout Repository
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 2: Setup Java
      - name: Stage 2 - Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Stage 3: Setup Node.js & Android SDK
      - name: Stage 3 - Setup Node.js 22 & Android SDK
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Stage 4: Install Dependencies
      - name: Stage 4 - Install Project Dependencies
        run: |
          echo "Installing frontend dependencies..."
          cd frontend
          npm install --legacy-peer-deps
          cd ../automation
          npm install

      # Stage 5: Build Android APK
      - name: Stage 5 - Build Android Release / Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/release/ || ls -la app/build/outputs/apk/debug/

      # Stage 6 & 7: Start Android Emulator & Verify Readiness
      - name: Stage 6 & 7 - Start Android Emulator & Verify Readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          avd-name: test-avd-34
          script: |
            echo "Stage 7 - Verifying Emulator boot completed..."
            adb wait-for-device
            boot_completed=""
            while [ "$boot_completed" != "1" ]; do
              boot_completed=`adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'`
              echo "Waiting for device boot completion (current status: $boot_completed)..."
              sleep 2
            done
            echo "Emulator booted successfully!"
            adb shell settings put global window_animation_scale 0.0
            adb shell settings put global transition_animation_scale 0.0
            adb shell settings put global animator_duration_scale 0.0

      # Stage 8: Install APK on Running Emulator
      - name: Stage 8 - Install APK on Android Device
        run: |
          APK_FILE=$(find frontend/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Installing APK: $APK_FILE"
          adb install -r "$APK_FILE"
          adb shell pm list packages | grep foodiebite || true

      # Stage 9 & 10: Start Appium Server & Verify Health
      - name: Stage 9 & 10 - Start Appium Server & Verify Health
        run: |
          npm install -g appium
          appium driver install uiautomator2
          nohup appium --log "Test Results/Logs/appium-server.log" --port 4723 --address 127.0.0.1 > /dev/null 2>&1 &
          
          echo "Stage 10 - Waiting for Appium Server health check..."
          for i in {1..20}; do
            STATUS=$(curl -s http://127.0.0.1:4723/status | grep -o '"ready":true' || true)
            if [ -n "$STATUS" ]; then
              echo "Appium Server is READY!"
              break
            fi
            echo "Waiting for Appium Server ($i/20)..."
            sleep 2
          done

      # Stage 11 - 17: Execute 400+ E2E Tests & Generate Multi-Format Reports
      - name: Stage 11-17 - Execute Appium E2E Suites & Generate Reports
        run: |
          mkdir -p "Test Results/Excel" "Test Results/HTML" "Test Results/JSON" "Test Results/Screenshots" "Test Results/Logs" "Test Results/Summary" reports/latest
          cd automation
          node runners/masterRunner.js

      # Stage 12 & 13: Capture Device Logs & Snapshots
      - name: Stage 12 & 13 - Capture Device Logs & Telemetry
        if: always()
        run: |
          adb logcat -d > "Test Results/Logs/android-logcat.log" || true
          adb shell screencap -p /sdcard/failure_snapshot.png || true
          adb pull /sdcard/failure_snapshot.png "Test Results/Screenshots/device_final_state.png" || true

      # Stage 18: Upload Artifacts (Retention: 30 Days)
      - name: Stage 18 - Upload Test & Quality Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foodiebite-mobile-e2e-artifacts
          path: |
            Test Results/
            reports/
          retention-days: 30

      # Stage 19 & 20: Publish Reports to GitHub Pages & Update History
      - name: Stage 19 & 20 - Publish Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          destination_dir: reports
          keep_files: true

      # Stage 21: Publish GitHub Actions Step Summary
      - name: Stage 21 - Publish GitHub Actions Step Summary
        if: always()
        run: |
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Execution Summary file not found" >> $GITHUB_STEP_SUMMARY
          fi
