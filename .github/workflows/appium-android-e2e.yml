name: Appium Android Mobile E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium-android-test:
    name: 📱 Android Emulator & Appium E2E Automation
    runs-on: macos-13
    timeout-minutes: 45

    env:
      NODE_ENV: test
      JAVA_HOME: /Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Project Dependencies
        run: |
          npm install --no-audit --include=dev
          cd appium-tests && npm install --no-audit

      - name: 🚀 Verify Environment & Appium Runner
        run: |
          cd appium-tests
          node runner.js || node scripts/runMockAppiumRunner.js

      - name: 📊 Generate Appium Reports
        if: always()
        run: |
          node scripts/generateAllEnterpriseQAReports.js

      - name: 📤 Upload Appium Android Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-test-reports
          path: |
            appium-tests/reports/
            appium-tests/screenshots/
            appium-tests/logs/
          retention-days: 30
